name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - name: Build with zero warnings
        run: cargo build --workspace --all-targets
        env:
          RUSTFLAGS: -D warnings
      - name: Hermetic test suite
        run: cargo test --workspace --no-fail-fast
        env:
          RUSTFLAGS: -D warnings

  image:
    name: container image (build and smoke test, no push)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build (linux/amd64)
        run: docker buildx build --platform linux/amd64 --cache-from type=gha --cache-to type=gha,mode=max --load -t cameleer:ci .
      - name: Smoke test (read-only root filesystem, arbitrary user)
        run: |
          docker run --rm cameleer:ci version
          docker run -d --name smoke --read-only --user 1000:1000 -p 18080:8080 \
            -v "$PWD/examples:/routes:ro" cameleer:ci run /routes/hello-api.camel.yaml
          ok=
          for i in $(seq 1 60); do
            if curl -fsS localhost:18080/orders/42 | grep -q shipped; then ok=1; break; fi
            sleep 1
          done
          docker logs smoke
          docker rm -f smoke
          [ -n "$ok" ]
      - name: Image size
        run: docker image ls cameleer:ci
