name: Pages

on:
  push:
    branches: [main]
    paths: ["site/**", "docs/**", "scripts/build-docs.py", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history: page dates (sitemap lastmod, dateModified) come from git
      - name: Build the docs into site/docs
        run: python3 scripts/build-docs.py
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Tell search engines about the pages (IndexNow; Bing, Yandex and others, not Google)
        continue-on-error: true
        env:
          INDEXNOW_KEY: c7c97f8e9934b0549f4bb12932539293
        run: |
          set -euo pipefail
          base="https://pmsudhi.github.io/cameleer"
          python3 - <<'PY' > urls.json
          import json, os, re
          urls = re.findall(r"<loc>([^<]+)</loc>", open("site/sitemap.xml", encoding="utf-8").read())
          print(json.dumps({"host": "pmsudhi.github.io", "key": os.environ["INDEXNOW_KEY"],
                            "keyLocation": "https://pmsudhi.github.io/cameleer/" + os.environ["INDEXNOW_KEY"] + ".txt",
                            "urlList": urls[:10000]}))
          PY
          code=$(curl -sS -o /dev/null -w "%{http_code}" -X POST "https://api.indexnow.org/indexnow"             -H "Content-Type: application/json; charset=utf-8" --data @urls.json)
          echo "IndexNow answered HTTP $code for $(python3 -c 'import json;print(len(json.load(open("urls.json"))["urlList"]))') URLs"
